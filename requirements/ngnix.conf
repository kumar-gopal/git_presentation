#!/bin/bash

echo "======================================================="
echo "   🚀 INSTALLING POSTFIX + FAIL2BAN (Production Setup)"
echo "======================================================="

# ---------------------------------------------------------
# 1) INSTALL POSTFIX (Mail Server)
# ---------------------------------------------------------
echo "📩 Installing Postfix..."
sudo debconf-set-selections <<< "postfix postfix/mailname string yourserver.com"
sudo debconf-set-selections <<< "postfix postfix/main_mailer_type string 'Internet Site'"
sudo apt install -y postfix mailutils

echo "✔️ Postfix installed"

# ---------------------------------------------------------
# 2) CONFIGURE POSTFIX (Recommended Production Settings)
# ---------------------------------------------------------

POSTFIX_MAIN="/etc/postfix/main.cf"

echo "🛠️ Configuring Postfix..."

sudo postconf -e "myhostname=yourserver.com"
sudo postconf -e "myorigin=/etc/mailname"
sudo postconf -e "inet_interfaces=all"
sudo postconf -e "inet_protocols=all"
sudo postconf -e "mydestination=\$myhostname, localhost.localdomain, localhost"
sudo postconf -e "relayhost="
sudo postconf -e "smtp_tls_security_level=may"
sudo postconf -e "smtp_tls_loglevel=1"
sudo postconf -e "smtp_tls_CAfile=/etc/ssl/certs/ca-certificates.crt"

sudo systemctl restart postfix

echo "✔️ Postfix configured"

# ---------------------------------------------------------
# 3) INSTALL FAIL2BAN
# ---------------------------------------------------------
echo "🛡️ Installing Fail2ban..."
sudo apt update -y
sudo apt install -y fail2ban

echo "✔️ Fail2ban installed"

# ---------------------------------------------------------
# 4) FAIL2BAN DEFAULT EMAIL SETTINGS
# ---------------------------------------------------------
echo "📧 Configuring Fail2ban to send Email Alerts using Postfix..."

sudo tee /etc/fail2ban/jail.local > /dev/null << 'EOF'
[DEFAULT]
destemail = contactkrgopal@gmail.com
sender = fail2ban@axesell.co
mta = sendmail
action = %(action_mwl)s

ignoreip = 127.0.0.1/8 ::1 49.204.158.47
# Ban on repeated offenses
bantime = 6h
findtime = 10m
maxretry = 5

#################################################################
# 1) Protect from 404 scanning
#################################################################
[nginx-404]
enabled  = true
filter   = nginx-404
logpath  = /var/log/nginx/access.log
maxretry = 20
findtime = 5m
bantime  = 2h

#################################################################
# 2) Bruteforce Protection
#################################################################
[nginx-login-bruteforce]
enabled = true
filter = nginx-login-bruteforce
logpath = /var/log/nginx/access.log
maxretry = 5
findtime = 10m
bantime = 6h

#################################################################
# 3) Rate Limit Abuse
#################################################################
[nginx-limit-req]
enabled = true
filter = nginx-limit-req
logpath = /var/log/nginx/error.log
maxretry = 3
findtime = 2m
bantime = 1h

#################################################################
# 4) Detect scripts (.php, .asp probes)
#################################################################
[nginx-noscript]
enabled = true
filter = nginx-noscript
logpath = /var/log/nginx/access.log
maxretry = 5
findtime = 5m
bantime = 3h
EOF

# ---------------------------------------------------------
# 5) CREATE FILTER FILES
# ---------------------------------------------------------
echo "📁 Creating Fail2ban filter files..."

sudo tee /etc/fail2ban/filter.d/nginx-404.conf > /dev/null << 'EOF'
[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD).*" 404
EOF

sudo tee /etc/fail2ban/filter.d/nginx-login-bruteforce.conf > /dev/null << 'EOF'
[Definition]
failregex = ^<HOST> -.*"(POST|GET) /api/auth/login.*" 401
            ^<HOST> -.*"(POST|GET) /login.*" 401
EOF

sudo tee /etc/fail2ban/filter.d/nginx-limit-req.conf > /dev/null << 'EOF'
[Definition]
failregex = limiting requests, excess:.* by <HOST>
EOF

sudo tee /etc/fail2ban/filter.d/nginx-noscript.conf > /dev/null << 'EOF'
[Definition]
failregex = ^<HOST> -.*"(GET|POST).*\.php.*" 404
            ^<HOST> -.*"(GET|POST).*\.asp.*" 404
EOF

echo "✔️ Filter files created"


# ---------------------------------------------------------
# 6) RESTART FAIL2BAN
# ---------------------------------------------------------
echo "🔄 Restarting Fail2ban..."
sudo systemctl restart fail2ban
sudo systemctl enable fail2ban

echo "✔️ Fail2ban restarted"

# ---------------------------------------------------------
# 7) SEND TEST EMAIL
# ---------------------------------------------------------
echo "✉️ Sending test email..."

echo "Fail2ban Email Test from VPS" | mail -s "Fail2ban Email Test" kumargopal782001@gmail.com

echo "======================================================="
echo "   🎉 Installation Complete"
echo "   Fail2ban + Postfix Email Protection is Enabled"
echo "======================================================="



