# Create rate limit zone (10 requests/second)
# Solves: API abuse, bot traffic
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Force HTTPS (security requirement)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # Load SSL certs
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # Improve SSL security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Prevent Clickjacking + XSS + content sniffing
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API reverse proxy
    location /api/ {

        # Apply rate limit defined above
        limit_req zone=api_limit burst=20 nodelay;

        # Protect backend from showing IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Host $host;
        proxy_pass http://localhost:5000;  # Node.js backend running in systemd

        # Increase request size (important for file upload APIs)
        client_max_body_size 50M;
    }

    # Serve frontend files (optional)
    location / {
        root /var/www/myapp/frontend;
        try_files $uri $uri/ /index.html;
    }
}




