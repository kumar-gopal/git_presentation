##############################################
# REDIS PRODUCTION CONFIGURATION (SECURE)
# Environment: VPS / Cloud VM
##############################################

##############################################
# NETWORK SECURITY
##############################################

# Bind only to localhost (your app runs on same server)
bind 127.0.0.1

# Disable external exposure
protected-mode yes

# Require password authentication
requirepass YourStrongSecurePassword123!

# Default Redis port
port 6379


##############################################
# MEMORY & PERFORMANCE
##############################################

# Use LRU (Least Recently Used) eviction strategy
maxmemory-policy allkeys-lru

# Set maximum memory usage (example: 1 GB)
maxmemory 1gb

# Enable TCP keepalive to detect dead connections
tcp-keepalive 60

# Disable saving the DB on every write (use append-only)
save ""

# Enable append-only persistence (recommended for durability)
appendonly yes
appendfsync everysec

# Compression for AOF file
aof-use-rdb-preamble yes


##############################################
# LOGGING
##############################################

# Store logs in a specific file
logfile /var/log/redis/redis-server.log

# Log level: debug | verbose | notice | warning
loglevel notice


##############################################
# SECURITY HARDENING (DISABLE DANGEROUS COMMANDS)
##############################################

rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command KEYS ""
rename-command DEBUG ""
rename-command SAVE ""
rename-command RESTORE ""
rename-command BGREWRITEAOF ""
rename-command BGSAVE ""
rename-command SLAVEOF ""
rename-command REPLICAOF ""
rename-command CLIENT ""
rename-command EVAL ""
rename-command SCRIPT ""


##############################################
# CLIENT CONNECTION CONTROL
##############################################

# Limit simultaneous clients
maxclients 10000

# Disconnect idle clients after 5 minutes
timeout 300


##############################################
# APPEND ONLY FILE BACKUP SETTINGS
##############################################

# Auto rewrite the AOF file if it grows too large
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb


##############################################
# CLUSTER / REPLICATION (if you scale later)
##############################################
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 5000
# cluster-announce-ip 127.0.0.1
# cluster-announce-port 6379


##############################################
# ADVANCED SECURITY
##############################################

# Prevent accidental mass deletion
rename-command DEL "DANGEROUS_DEL"

# Disable Lua scripts (potential security holes)
lua-time-limit 1000

# Disable RDB snapshotting on write (prefer append-only)
stop-writes-on-bgsave-error no
